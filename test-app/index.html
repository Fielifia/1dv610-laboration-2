<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Form Validation Playground</title>
  </head>

  <body>
    <div class="test-app">
      <header>
        <h1>Form Validation Playground</h1>
        <h3>Test the Form Validation Module with different forms</h3>
      </header>

      <div class="form" id="registration-form">
        <h2>Registration Form</h2>
        <form id="registration">
          <div class="form-fields">
            <div class="form-group">
              <label for="username">Username:</label>
              <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label for="age">Age:</label>
              <input type="text" id="age" name="age" autocomplete="age" />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="password">Password:</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
              />
            </div>

            <div class="form-group">
              <label for="passwordConfirmation">Confirm password:</label>
              <input
                type="password"
                id="passwordConfirmation"
                name="passwordConfirmation"
                autocomplete="new-password"
              />
            </div>
          </div>

          <button type="submit">Validate</button>
        </form>

        <div class="result">
          <h3>Result:</h3>
        <div class="result-report">

        </div>
      </div>
    </div>
  </body>
</html>
